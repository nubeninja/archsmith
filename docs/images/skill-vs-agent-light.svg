<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Run archsmith as a skill (default) or as an agent"><title>Run archsmith as a skill (default) or as an agent</title><rect width="1200" height="520" fill="#ffffff"/><g font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><text x="600" y="78" text-anchor="middle" font-size="54" font-weight="800" fill="#0f172a" letter-spacing="-2">Run it as a skill or an agent</text><rect x="20" y="110" width="570" height="310" rx="18" fill="#f8fafc" stroke="#c46a00" stroke-width="3"/><text x="52" y="172" font-size="38" font-weight="800" fill="#c46a00">Skill<tspan dx="12" font-size="18" font-weight="500" fill="#475569" letter-spacing="1">DEFAULT</tspan></text><line x1="52" y1="196" x2="558" y2="196" stroke="#cbd5e1"/><path d="M56 222 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="232" font-size="25" fill="#0f172a">Runs inside your chat</text><line x1="52" y1="250" x2="558" y2="250" stroke="#cbd5e1"/><path d="M56 276 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="286" font-size="25" fill="#0f172a">Cheaper per run</text><line x1="52" y1="304" x2="558" y2="304" stroke="#cbd5e1"/><path d="M56 330 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="340" font-size="25" fill="#0f172a">You can steer it while it works</text><line x1="52" y1="358" x2="558" y2="358" stroke="#cbd5e1"/><path d="M56 384 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="394" font-size="25" fill="#0f172a">Best for small repos and slides</text><rect x="610" y="110" width="570" height="310" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="642" y="172" font-size="38" font-weight="800" fill="#1d4ed8">Agent<tspan dx="12" font-size="18" font-weight="500" fill="#475569" letter-spacing="1">OWN CONTEXT</tspan></text><line x1="642" y1="196" x2="1148" y2="196" stroke="#cbd5e1"/><path d="M646 222 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="232" font-size="25" fill="#0f172a">Runs in its own context</text><line x1="642" y1="250" x2="1148" y2="250" stroke="#cbd5e1"/><path d="M646 276 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="286" font-size="25" fill="#0f172a">Keeps your chat clean</text><line x1="642" y1="304" x2="1148" y2="304" stroke="#cbd5e1"/><path d="M646 330 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="340" font-size="25" fill="#0f172a">Uses more tokens in total</text><line x1="642" y1="358" x2="1148" y2="358" stroke="#cbd5e1"/><path d="M646 384 l7 8 l14 -16" fill="none" stroke="#c46a00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="394" font-size="25" fill="#0f172a">Best for large repos, full rebuilds</text><text x="543" y="480" text-anchor="end" font-size="30" fill="#0f172a">Choose with</text><rect x="563" y="448" width="270" height="46" rx="23" fill="#fff4e5" stroke="#c46a00" stroke-width="2"/><text x="698" y="480" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="24" fill="#c46a00">/archsmith:setup</text></g></svg>