<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="How archsmith works: read your repo, build the diagram, check it, review it in draw.io"><title>How archsmith works: read your repo, build the diagram, check it, review it in draw.io</title><rect width="1200" height="520" fill="#0d1117"/><g font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><text x="600" y="92" text-anchor="middle" font-size="60" font-weight="800" fill="#f1f5f9" letter-spacing="-2">How <tspan fill="#ffa31a">archsmith</tspan> works</text><rect x="20.0" y="130" width="270.5" height="300" rx="16" fill="#161b22" stroke="#3b4655" stroke-width="2"/><rect x="290.5" y="172" width="26" height="4" fill="#ffa31a"/><circle cx="68.0" cy="174" r="26" fill="#ffa31a"/><text x="68.0" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#0d1117">1</text><text x="42.0" y="250" font-size="30" font-weight="700" fill="#f1f5f9">Read your repo</text><text x="42.0" y="286" font-size="20" fill="#b6c2d4">Terraform,</text><text x="42.0" y="314" font-size="20" fill="#b6c2d4">CloudFormation, CDK,</text><text x="42.0" y="342" font-size="20" fill="#b6c2d4">Helm and workflows.</text><text x="42.0" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#ffa31a">tf_summary.py</text><rect x="316.5" y="130" width="270.5" height="300" rx="16" fill="#161b22" stroke="#3b4655" stroke-width="2"/><rect x="587.0" y="172" width="26" height="4" fill="#ffa31a"/><circle cx="364.5" cy="174" r="26" fill="#ffa31a"/><text x="364.5" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#0d1117">2</text><text x="338.5" y="250" font-size="30" font-weight="700" fill="#f1f5f9">Build the</text><text x="338.5" y="284" font-size="30" font-weight="700" fill="#f1f5f9">diagram</text><text x="338.5" y="320" font-size="20" fill="#b6c2d4">Overview tabs plus</text><text x="338.5" y="348" font-size="20" fill="#b6c2d4">1920x1080 slide tabs.</text><text x="338.5" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#ffa31a">drawio_lib.py</text><rect x="613.0" y="130" width="270.5" height="300" rx="16" fill="#161b22" stroke="#3b4655" stroke-width="2"/><rect x="883.5" y="172" width="26" height="4" fill="#ffa31a"/><circle cx="661.0" cy="174" r="26" fill="#ffa31a"/><text x="661.0" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#0d1117">3</text><text x="635.0" y="250" font-size="30" font-weight="700" fill="#f1f5f9">Check it</text><text x="635.0" y="286" font-size="20" fill="#b6c2d4">XML, text size, labels</text><text x="635.0" y="314" font-size="20" fill="#b6c2d4">and overlaps.</text><text x="635.0" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#ffa31a">validate.py</text><rect x="909.5" y="130" width="270.5" height="300" rx="16" fill="#161b22" stroke="#3b4655" stroke-width="2"/><circle cx="957.5" cy="174" r="26" fill="#ffa31a"/><text x="957.5" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#0d1117">4</text><text x="931.5" y="250" font-size="30" font-weight="700" fill="#f1f5f9">Review in</text><text x="931.5" y="284" font-size="30" font-weight="700" fill="#f1f5f9">draw.io</text><text x="931.5" y="320" font-size="20" fill="#b6c2d4">Open the file, adjust</text><text x="931.5" y="348" font-size="20" fill="#b6c2d4">it, share it.</text><text x="931.5" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#ffa31a">diagram/*.drawio</text><text x="600" y="486" text-anchor="middle" font-size="28" fill="#b6c2d4">Output: one <tspan fill="#ffa31a">.drawio</tspan> file in <tspan fill="#ffa31a">diagram/</tspan></text></g></svg>