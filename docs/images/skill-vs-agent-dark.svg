<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Run archsmith as a skill (default) or as an agent"><title>Run archsmith as a skill (default) or as an agent</title><rect width="1200" height="520" fill="#0d1117"/><g font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><text x="600" y="78" text-anchor="middle" font-size="54" font-weight="800" fill="#f1f5f9" letter-spacing="-2">Run it as a skill or an agent</text><rect x="20" y="110" width="570" height="310" rx="18" fill="#161b22" stroke="#ffa31a" stroke-width="3"/><text x="52" y="172" font-size="38" font-weight="800" fill="#ffa31a">Skill<tspan dx="12" font-size="18" font-weight="500" fill="#b6c2d4" letter-spacing="1">DEFAULT</tspan></text><line x1="52" y1="196" x2="558" y2="196" stroke="#3b4655"/><path d="M56 222 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="232" font-size="25" fill="#f1f5f9">Runs inside your chat</text><line x1="52" y1="250" x2="558" y2="250" stroke="#3b4655"/><path d="M56 276 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="286" font-size="25" fill="#f1f5f9">Cheaper per run</text><line x1="52" y1="304" x2="558" y2="304" stroke="#3b4655"/><path d="M56 330 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="340" font-size="25" fill="#f1f5f9">You can steer it while it works</text><line x1="52" y1="358" x2="558" y2="358" stroke="#3b4655"/><path d="M56 384 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="394" font-size="25" fill="#f1f5f9">Best for small repos and slides</text><rect x="610" y="110" width="570" height="310" rx="18" fill="#161b22" stroke="#3b4655" stroke-width="2"/><text x="642" y="172" font-size="38" font-weight="800" fill="#60a5fa">Agent<tspan dx="12" font-size="18" font-weight="500" fill="#b6c2d4" letter-spacing="1">OWN CONTEXT</tspan></text><line x1="642" y1="196" x2="1148" y2="196" stroke="#3b4655"/><path d="M646 222 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="232" font-size="25" fill="#f1f5f9">Runs in its own context</text><line x1="642" y1="250" x2="1148" y2="250" stroke="#3b4655"/><path d="M646 276 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="286" font-size="25" fill="#f1f5f9">Keeps your chat clean</text><line x1="642" y1="304" x2="1148" y2="304" stroke="#3b4655"/><path d="M646 330 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="340" font-size="25" fill="#f1f5f9">Uses more tokens in total</text><line x1="642" y1="358" x2="1148" y2="358" stroke="#3b4655"/><path d="M646 384 l7 8 l14 -16" fill="none" stroke="#ffa31a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="394" font-size="25" fill="#f1f5f9">Best for large repos, full rebuilds</text><text x="543" y="480" text-anchor="end" font-size="30" fill="#f1f5f9">Choose with</text><rect x="563" y="448" width="270" height="46" rx="23" fill="#2a1d08" stroke="#ffa31a" stroke-width="2"/><text x="698" y="480" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="24" fill="#ffa31a">/archsmith:setup</text></g></svg>