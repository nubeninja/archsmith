<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="How archsmith works: read your repo, build the diagram, check it, review it in draw.io"><title>How archsmith works: read your repo, build the diagram, check it, review it in draw.io</title><rect width="1200" height="520" fill="#ffffff"/><g font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><text x="600" y="92" text-anchor="middle" font-size="60" font-weight="800" fill="#0f172a" letter-spacing="-2">How <tspan fill="#c46a00">archsmith</tspan> works</text><rect x="20.0" y="130" width="270.5" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="290.5" y="172" width="26" height="4" fill="#c46a00"/><circle cx="68.0" cy="174" r="26" fill="#c46a00"/><text x="68.0" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">1</text><text x="42.0" y="250" font-size="30" font-weight="700" fill="#0f172a">Read your repo</text><text x="42.0" y="286" font-size="20" fill="#475569">Terraform,</text><text x="42.0" y="314" font-size="20" fill="#475569">CloudFormation, CDK,</text><text x="42.0" y="342" font-size="20" fill="#475569">Helm and workflows.</text><text x="42.0" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#c46a00">tf_summary.py</text><rect x="316.5" y="130" width="270.5" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="587.0" y="172" width="26" height="4" fill="#c46a00"/><circle cx="364.5" cy="174" r="26" fill="#c46a00"/><text x="364.5" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">2</text><text x="338.5" y="250" font-size="30" font-weight="700" fill="#0f172a">Build the</text><text x="338.5" y="284" font-size="30" font-weight="700" fill="#0f172a">diagram</text><text x="338.5" y="320" font-size="20" fill="#475569">Overview tabs plus</text><text x="338.5" y="348" font-size="20" fill="#475569">1920x1080 slide tabs.</text><text x="338.5" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#c46a00">drawio_lib.py</text><rect x="613.0" y="130" width="270.5" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="883.5" y="172" width="26" height="4" fill="#c46a00"/><circle cx="661.0" cy="174" r="26" fill="#c46a00"/><text x="661.0" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">3</text><text x="635.0" y="250" font-size="30" font-weight="700" fill="#0f172a">Check it</text><text x="635.0" y="286" font-size="20" fill="#475569">XML, text size, labels</text><text x="635.0" y="314" font-size="20" fill="#475569">and overlaps.</text><text x="635.0" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#c46a00">validate.py</text><rect x="909.5" y="130" width="270.5" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="957.5" cy="174" r="26" fill="#c46a00"/><text x="957.5" y="185" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">4</text><text x="931.5" y="250" font-size="30" font-weight="700" fill="#0f172a">Review in</text><text x="931.5" y="284" font-size="30" font-weight="700" fill="#0f172a">draw.io</text><text x="931.5" y="320" font-size="20" fill="#475569">Open the file, adjust</text><text x="931.5" y="348" font-size="20" fill="#475569">it, share it.</text><text x="931.5" y="410" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#c46a00">diagram/*.drawio</text><text x="600" y="486" text-anchor="middle" font-size="28" fill="#475569">Output: one <tspan fill="#c46a00">.drawio</tspan> file in <tspan fill="#c46a00">diagram/</tspan></text></g></svg>